<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menü der Sinne 🌹</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(160deg,#1a0a10 0%,#2d1120 60%,#160810 100%); min-height: 100vh; font-family: Georgia, serif; }
    button { font-family: Georgia, serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a0a10; }
    ::-webkit-scrollbar-thumb { background: #c8476a44; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const TELEGRAM_BOT_TOKEN = "8923778261:AAESWYmkV3ekFvtR4tY4RaxefPOuW5nhZR4";
    const TELEGRAM_CHAT_ID = "1518259505";

    const COURSES = [
      {
        id: "starter",
        label: "Vorspeise",
        subtitle: "Ein verlockendes Vorspiel",
        items: [
          { id: "v1",  emoji: "🤗", name: "Zärtliches Kuscheln",   desc: "Warme Umarmungen, Nähe spüren" },
          { id: "v2",  emoji: "💆", name: "Sanfte Massage",        desc: "Wohltuende Berührung am ganzen Körper" },
          { id: "v3",  emoji: "💋", name: "Leidenschaftliche Küsse", desc: "Tiefes, intensives Küssen" },
          { id: "v4",  emoji: "🌸", name: "Oralverkehr (für Sie)",  desc: "Hingebungsvolle Aufmerksamkeit mit Lippen & Zunge" },
          { id: "v5",  emoji: "🔥", name: "Oralverkehr (für Ihn)",  desc: "Liebevolle, intime Aufmerksamkeit" },
          { id: "v6",  emoji: "🫦", name: "Körper erkunden",       desc: "Jeden Zentimeter mit den Händen entdecken" },
          { id: "v7",  emoji: "💃", name: "Verführerischer Strip",  desc: "Langsames Ausziehen mit intensivem Blickkontakt" },
          { id: "v8",  emoji: "🎭", name: "Rollenspiel",            desc: "Gemeinsam in eine spielerische Fantasie eintauchen" },
          { id: "v9",  emoji: "🕯️", name: "Erotische Massage",      desc: "Duftendes Öl, Kerzenschein & langsame Hände" },
          { id: "v10", emoji: "🗣️", name: "Dirty Talk",            desc: "Worte, die unter die Haut gehen" },
          { id: "v11", emoji: "🪶", name: "Kitzeln & Necken",      desc: "Spielerische Berührungen und Lachen" },
          { id: "v12", emoji: "🛁", name: "Gemeinsames Schaumbad", desc: "Schaumbad für zwei mit Wein" },
          { id: "v13", emoji: "🫣", name: "Augenbinde",             desc: "Sinne schärfen durch Verzicht auf das Sehen" },
          { id: "v14", emoji: "✨", name: "Nackte Umarmung",       desc: "Haut auf Haut, ohne Eile, reine Präsenz" },
          { id: "v15", emoji: "🚿", name: "Gemeinsam duschen",     desc: "Heiß & dampfend für zwei" },
        ],
      },
      {
        id: "main",
        label: "Hauptgang",
        subtitle: "Das Herzstück des Abends",
        items: [
          { id: "h1",  emoji: "👫", name: "Missionar",             desc: "Klassisch, intim, Blickkontakt" },
          { id: "h2",  emoji: "🐎", name: "Reiterstellung",        desc: "Sie übernimmt oben die Führung" },
          { id: "h3",  emoji: "🥄", name: "Löffelchen",            desc: "Gemütlich & vertraut von hinten" },
          { id: "h4",  emoji: "🔥", name: "Doggy Style",           desc: "Leidenschaftlich und intensiv" },
          { id: "h5",  emoji: "🚪", name: "Im Stehen",             desc: "An der Wand, spontan" },
          { id: "h6",  emoji: "🛏️", name: "Bettkante",             desc: "Er steht, sie liegt – perfekte Harmonie" },
          { id: "h7",  emoji: "🦋", name: "Schmetterling",         desc: "Tiefe Verbindung & Intimität" },
          { id: "h8",  emoji: "💪", name: "Umgekehrte Reiterstellung", desc: "Sie ist oben, abgewandt" },
          { id: "h9",  emoji: "🪑", name: "Schoß-Sitz",            desc: "Gesicht an Gesicht, eng umschlungen" },
          { id: "h10", emoji: "♾️", name: "69-Stellung",           desc: "Gleichzeitige gegenseitige Lust" },
          { id: "h11", emoji: "🧘", name: "Tantra",                desc: "Langsam, achtsam & tief verbunden" },
          { id: "h12", emoji: "🍽️", name: "Auf dem Tisch",         desc: "Spontan & abenteuerlich" },
          { id: "h13", emoji: "🌶️", name: "Stehend von hinten",    desc: "Leidenschaftlich und sehr nah" },
          { id: "h14", emoji: "🪷", name: "Lotus-Sitz",            desc: "Sitzend umschlungen, langsam & tief" },
          { id: "h15", emoji: "👑", name: "Sie hat das Sagen",     desc: "Sie führt, er kniet vor ihr" },
          { id: "h16", emoji: "🌙", name: "Seitenlage",            desc: "Entspannt & intim, lange verweilen" },
        ],
      },
      {
        id: "dessert",
        label: "Dessert",
        subtitle: "Süßes Nachglühen & Fürsorge",
        items: [
          { id: "n1",  emoji: "🤗", name: "Nachglüh-Kuscheln",     desc: "Einfach nah bleiben und durchatmen" },
          { id: "n2",  emoji: "💋", name: "Sanfte Küsse",          desc: "Weich, langsam und verweilend" },
          { id: "n3",  emoji: "😴", name: "Zusammen einschlafen",   desc: "Umschlungen ins Land der Träume gleiten" },
          { id: "n4",  emoji: "🚿", name: "Gemeinsam duschen",     desc: "Erfrischen und umsorgt fühlen" },
          { id: "n5",  emoji: "🍓", name: "Snacks & Früchte",      desc: "Erdbeeren, Schokolade, Champagner" },
          { id: "n6",  emoji: "🎬", name: "Film schauen",          desc: "Eingekuschelt in Decken einen Film schauen" },
          { id: "n7",  emoji: "💬", name: "Flüstern & Plaudern",   desc: "Über alles und nichts sprechen" },
          { id: "n8",  emoji: "💆", name: "Sanftes Rückenstreicheln", desc: "Zur Ruhe kommen und alles ausklingen lassen" },
          { id: "n9",  emoji: "🪄", name: "Haare streicheln",      desc: "Sanft mit den Fingern durchs Haar fahren" },
          { id: "n10", emoji: "🛁", name: "Entspannungsbad",       desc: "Warmes Bad mit Badesalz & Kerzen" },
          { id: "n11", emoji: "❤️", name: "Liebeserklärung",       desc: "Sagen, was man füreinander empfindet" },
          { id: "n12", emoji: "🎵", name: "Gemeinsame Playlist",   desc: "Musik, die den Abend abrundet" },
        ],
      },
    ];

    const CartIcon = ({ count }) => (
      <div style={{ position: "relative", display: "inline-block" }}>
        <span style={{ fontSize: 28 }}>🛒</span>
        {count > 0 && (
          <span style={{
            position: "absolute", top: -6, right: -8,
            background: "#c8476a", color: "#fff",
            borderRadius: "50%", width: 20, height: 20,
            fontSize: 11, fontWeight: 700,
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>{count}</span>
        )}
      </div>
    );

    function App() {
      const [activeCourse, setActiveCourse] = useState("starter");
      const [cart, setCart] = useState([]);
      const [view, setView] = useState("menu");
      const [pulse, setPulse] = useState(null);
      const [loading, setLoading] = useState(false);

      const toggleCart = (item, courseId) => {
        setPulse(item.id);
        setTimeout(() => setPulse(null), 380);
        setCart(prev =>
          prev.find(c => c.id === item.id)
            ? prev.filter(c => c.id !== item.id)
            : [...prev, { ...item, courseId }]
        );
      };

      const inCart = id => cart.some(c => c.id === id);
      const cartByCourse = COURSES.map(course => ({
        ...course,
        cartItems: cart.filter(c => c.courseId === course.id),
      })).filter(c => c.cartItems.length > 0);

      const currentCourse = COURSES.find(c => c.id === activeCourse);

      const sendToTelegram = async () => {
        setLoading(true);
        let messageText = "🌹 *NEUE BESTELLUNG ERHALTEN!* 🌹\n\n";

        cartByCourse.forEach(course => {
          messageText += `*${course.label} — ${course.subtitle}*\n`;
          course.cartItems.forEach(item => {
            messageText += `• ${item.emoji} *${item.name}*: ${item.desc}\n`;
          });
          messageText += "\n";
        });

        messageText += "✨ _Genießt euren gemeinsamen Abend!_ ✨";

        try {
          const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              text: messageText,
              parse_mode: "Markdown"
            })
          });

          if (response.ok) {
            setView("done");
          } else {
            alert("Fehler beim Senden der Bestellung. Bitte versuche es erneut.");
          }
        } catch (error) {
          alert("Netzwerkfehler beim Senden an Telegram.");
        } finally {
          setLoading(false);
        }
      };

      /* ── Fertig-Bildschirm ── */
      if (view === "done") return (
        <div style={S.page}>
          <div style={S.doneCard}>
            <div style={{ fontSize: 64, marginBottom: 12 }}>💌</div>
            <h1 style={{ color: "#f7d0da", fontSize: 26, margin: "0 0 6px", letterSpacing: 2, fontStyle: "italic" }}>Bestellung aufgegeben!</h1>
            <p style={{ color: "#c8476a", fontSize: 11, letterSpacing: 4, textTransform: "uppercase", margin: "0 0 28px" }}>Der Abend kann beginnen</p>
            {cartByCourse.map(course => (
              <div key={course.id} style={{ marginBottom: 20, textAlign: "left" }}>
                <div style={{ color: "#c8476a", fontSize: 10, letterSpacing: 3, textTransform: "uppercase", marginBottom: 8, paddingBottom: 6, borderBottom: "1px solid #c8476a22" }}>
                  {course.label} — {course.subtitle}
                </div>
                {course.cartItems.map(item => (
                  <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 12, background: "#ffffff06", borderRadius: 10, padding: "10px 14px", marginBottom: 6 }}>
                    <span style={{ fontSize: 26 }}>{item.emoji}</span>
                    <div>
                      <div style={{ color: "#f7d0da", fontSize: 14, fontWeight: 600 }}>{item.name}</div>
                      <div style={{ color: "#c8476a88", fontSize: 11 }}>{item.desc}</div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
            <p style={{ color: "#c8476a66", fontSize: 12, fontStyle: "italic", margin: "16px 0 24px" }}>Genießt jeden Moment — ihr habt es euch verdient. ❤️</p>
            <button onClick={() => { setCart([]); setView("menu"); }} style={S.ghostBtn}>Neu beginnen</button>
          </div>
        </div>
      );

      /* ── Warenkorb-Bildschirm ── */
      if (view === "cart") return (
        <div style={S.page}>
          <div style={{ maxWidth: 640, margin: "0 auto", padding: "0 20px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14, margin: "28px 0 32px" }}>
              <button onClick={() => setView("menu")} style={S.ghostBtn}>← Zurück</button>
              <h2 style={{ color: "#f7d0da", fontSize: 20, margin: 0, letterSpacing: 2 }}>Deine Auswahl</h2>
            </div>
            {cart.length === 0 ? (
              <div style={{ textAlign: "center", color: "#c8476a55", padding: 64 }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>🛒</div>
                <p style={{ fontStyle: "italic" }}>Noch nichts ausgewählt.</p>
              </div>
            ) : (
              <>
                {cartByCourse.map(course => (
                  <div key={course.id} style={{ marginBottom: 28 }}>
                    <div style={{ color: "#c8476a", fontSize: 10, letterSpacing: 4, textTransform: "uppercase", marginBottom: 10, paddingBottom: 8, borderBottom: "1px solid #c8476a22" }}>
                      {course.label} — {course.subtitle}
                    </div>
                    {course.cartItems.map(item => (
                      <div key={item.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "linear-gradient(135deg,#2a0f1a,#1f0d16)", border: "1px solid #c8476a22", borderRadius: 14, padding: "12px 16px", marginBottom: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                          <span style={{ fontSize: 30 }}>{item.emoji}</span>
                          <div>
                            <div style={{ color: "#f7d0da", fontSize: 14, fontWeight: 600 }}>{item.name}</div>
                            <div style={{ color: "#c8476a88", fontSize: 11, marginTop: 2 }}>{item.desc}</div>
                          </div>
                        </div>
                        <button onClick={() => toggleCart(item, course.id)} style={{ background: "transparent", border: "1px solid #c8476a44", color: "#c8476a", borderRadius: "50%", width: 28, height: 28, fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>×</button>
                      </div>
                    ))}
                  </div>
                ))}
                <button onClick={sendToTelegram} disabled={loading} style={{ ...S.orderBtn, display: "block", width: "100%", marginTop: 8, opacity: loading ? 0.7 : 1 }}>
                  {loading ? "Wird gesendet..." : "✦ Bestellung aufgeben ✦"}
                </button>
              </>
            )}
          </div>
        </div>
      );

      /* ── Menü-Bildschirm ── */
      return (
        <div style={S.page}>
          <header style={{ maxWidth: 960, margin: "0 auto", padding: "26px 20px 0", display: "flex", justifyContent: "space-between", alignItems: "flex-end" }}>
            <div>
              <div style={{ color: "#c8476a66", fontSize: 10, letterSpacing: 5, textTransform: "uppercase", marginBottom: 4 }}>Restaurant de l'Amour</div>
              <h1 style={{ color: "#f7d0da", fontSize: 26, margin: 0, letterSpacing: 1, fontStyle: "italic" }}>Menü der Sinne</h1>
            </div>
            <button onClick={() => setView("cart")} style={{ background: "transparent", border: "none", cursor: "pointer", padding: 6 }}>
              <CartIcon count={cart.length} />
            </button>
          </header>

          <div style={{ maxWidth: 960, margin: "0 auto", padding: "0 20px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14, margin: "18px 0 24px" }}>
              <div style={{ flex: 1, height: 1, background: "linear-gradient(to right,transparent,#c8476a33)" }} />
              <span style={{ color: "#c8476a44", fontSize: 20 }}>❧</span>
              <div style={{ flex: 1, height: 1, background: "linear-gradient(to left,transparent,#c8476a33)" }} />
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 28 }}>
              {COURSES.map(course => {
                const active = activeCourse === course.id;
                return (
                  <button key={course.id} onClick={() => setActiveCourse(course.id)} style={{
                    flex: 1, padding: "11px 8px",
                    background: active ? "linear-gradient(135deg,#c8476a,#8b1a3a)" : "transparent",
                    border: active ? "none" : "1px solid #c8476a33",
                    borderRadius: 50,
                    color: active ? "#fff" : "#c8476a77",
                    fontSize: 13, letterSpacing: 0.5, cursor: "pointer",
                    transition: "all 0.25s ease",
                    boxShadow: active ? "0 4px 20px #c8476a44" : "none",
                  }}>
                    {course.label}
                  </button>
                );
              })}
            </div>

            <div style={{ textAlign: "center", marginBottom: 22 }}>
              <h2 style={{ color: "#f7d0da", fontSize: 18, margin: "0 0 4px", letterSpacing: 2 }}>{currentCourse.label}</h2>
              <p style={{ color: "#c8476a", fontSize: 10, letterSpacing: 4, textTransform: "uppercase", margin: 0 }}>{currentCourse.subtitle}</p>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(148px, 1fr))", gap: 12, paddingBottom: 100 }}>
              {currentCourse.items.map(item => {
                const selected = inCart(item.id);
                const popping = pulse === item.id;
                return (
                  <button key={item.id} onClick={() => toggleCart(item, activeCourse)} style={{
                    background: selected ? "linear-gradient(145deg,#c8476a1a,#8b1a3a22)" : "linear-gradient(145deg,#2a0f1a,#1f0d16)",
                    border: selected ? "1px solid #c8476aaa" : "1px solid #c8476a18",
                    borderRadius: 18, padding: "20px 12px 14px",
                    cursor: "pointer", textAlign: "center",
                    transition: "all 0.2s ease",
                    transform: popping ? "scale(0.91)" : "scale(1)",
                    boxShadow: selected ? "0 4px 24px #c8476a2a" : "0 2px 12px #00000022",
                    position: "relative",
                  }}>
                    {selected && (
                      <div style={{ position: "absolute", top: 8, right: 10, background: "#c8476a", borderRadius: "50%", width: 18, height: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <svg viewBox="0 0 12 12" width="10" height="10">
                          <polyline points="2,6 5,9 10,3" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                        </svg>
                      </div>
                    )}
                    <div style={{ fontSize: 40, marginBottom: 10 }}>{item.emoji}</div>
                    <div style={{ color: selected ? "#f7d0da" : "#c8a0b0", fontSize: 12, fontWeight: 600, marginBottom: 4, lineHeight: 1.3 }}>{item.name}</div>
                    <div style={{ color: "#c8476a66", fontSize: 10, lineHeight: 1.4 }}>{item.desc}</div>
                  </button>
                );
              })}
            </div>
          </div>

          {cart.length > 0 && (
            <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 100 }}>
              <button onClick={() => setView("cart")} style={S.orderBtn}>
                🛒 Warenkorb anzeigen ({cart.length} {cart.length === 1 ? "Artikel" : "Artikel"})
              </button>
            </div>
          )}
        </div>
      );
    }

    const S = {
      page: { minHeight: "100vh", background: "linear-gradient(160deg,#1a0a10 0%,#2d1120 60%,#160810 100%)", fontFamily: "Georgia, serif" },
      doneCard: { background: "linear-gradient(145deg,#2a0f1a,#1a0810)", border: "1px solid #c8476a44", borderRadius: 24, padding: "48px 36px", maxWidth: 520, width: "calc(100% - 40px)", margin: "40px auto", textAlign: "center", boxShadow: "0 0 80px #c8476a22" },
      ghostBtn: { background: "transparent", border: "1px solid #c8476a44", color: "#c8476a", borderRadius: 50, padding: "9px 22px", fontSize: 12, fontFamily: "Georgia, serif", letterSpacing: 1, cursor: "pointer" },
      orderBtn: { background: "linear-gradient(135deg,#c8476a,#8b1a3a)", border: "none", color: "#fff", borderRadius: 50, padding: "14px 36px", fontSize: 14, fontFamily: "Georgia, serif", letterSpacing: 2, cursor: "pointer", boxShadow: "0 6px 32px #c8476a55", whiteSpace: "nowrap" },
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
