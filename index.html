                      <div style={{ color: "#f080a0aa", fontSize: 11 }}>{item.desc}</div>
                    </div>
                  </div>
                ))}
              </div>
            ))}

            {note && (
              <div style={{ textAlign: "left", background: "#ffffff0a", padding: 12, borderRadius: 10, marginBottom: 20 }}>
                <div style={{ color: "#ff8da8", fontSize: 11, fontWeight: 700, marginBottom: 4 }}>Sonderwunsch:</div>
                <div style={{ color: "#ffe3ec", fontSize: 13, fontStyle: "italic" }}>"{note}"</div>
              </div>
            )}

            <p style={{ color: "#f080a0aa", fontSize: 13, fontStyle: "italic", margin: "20px 0" }}>
              Mach dich bereit für einen unvergesslichen Abend voller Hingabe und Leidenschaft. ❤️
            </p>

            <button onClick={() => { setCart([]); setNote(""); setView("menu"); }} style={styles.ghostBtn}>
              Neu zusammenstellen
            </button>
          </div>
        </div>
      );

      if (view === "cart") return (
        <div style={styles.pageContainer}>
          <div style={{ maxWidth: 680, margin: "0 auto", padding: "20px 20px 100px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "20px 0 28px" }}>
              <button onClick={() => setView("menu")} style={styles.ghostBtn}>← Zurück zum Menü</button>
              <h2 className="serif" style={{ color: "#ffccd8", fontSize: 22, margin: 0 }}>Deine Auswahl ({cart.length})</h2>
            </div>

            {cart.length === 0 ? (
              <div style={{ textAlign: "center", color: "#f080a066", padding: "60px 0" }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>🛒</div>
                <p style={{ fontStyle: "italic" }}>Noch keine Gerichte ausgewählt.</p>
              </div>
            ) : (
              <>
                {cartByCourse.map(course => (
                  <div key={course.id} style={{ marginBottom: 28 }}>
                    <div style={{ color: "#ff8da8", fontSize: 11, letterSpacing: 3, textTransform: "uppercase", marginBottom: 12, paddingBottom: 6, borderBottom: "1px solid #ffffff18" }}>
                      {course.label} — {course.subtitle}
                    </div>
                    {course.cartItems.map(item => (
                      <div key={item.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "linear-gradient(135deg, #2b0b1a, #1a0510)", border: item.isKinky ? "1px solid #e23b6688" : "1px solid #ffffff15", borderRadius: 14, padding: "12px 16px", marginBottom: 10 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 14, paddingRight: 10 }}>
                          <span style={{ fontSize: 30 }}>{item.emoji}</span>
                          <div>
                            <div style={{ color: "#ffe3ec", fontSize: 15, fontWeight: 600 }}>
                              {item.name} {item.isKinky && <span style={styles.kinkyBadge}>Kinky / Dom</span>}
                            </div>
                            <div style={{ color: "#f080a0b0", fontSize: 12, marginTop: 2 }}>{item.desc}</div>
                          </div>
                        </div>
                        <button onClick={() => toggleCart(item, course.id)} style={styles.deleteBtn}>×</button>
                      </div>
                    ))}
                  </div>
                ))}

                <div style={{ marginTop: 24, marginBottom: 24 }}>
                  <label style={{ display: "block", color: "#ffccd8", fontSize: 13, marginBottom: 8, fontWeight: 600 }}>
                    🕯️ Sonderwünsche, Dresscode oder Uhrzeit (Optional):
                  </label>
                  <textarea
                    rows="3"
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    placeholder="z.B. Bitte halte die Seidenbänder bereit..."
                    style={styles.textarea}
                  />
                </div>

                <button onClick={sendToTelegram} disabled={loading} style={styles.primaryOrderBtn}>
                  {loading ? "Wird gesendet..." : "✦ Bestellung per Telegram aufgeben ✦"}
                </button>
              </>
            )}
          </div>
        </div>
      );

      return (
        <div style={styles.pageContainer}>
          <header style={{ maxWidth: 960, margin: "0 auto", padding: "28px 20px 10px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ color: "#f080a088", fontSize: 10, letterSpacing: 5, textTransform: "uppercase", marginBottom: 4 }}>
                Restaurant de l'Amour & Desire
              </div>
              <h1 className="serif" style={{ color: "#ffccd8", fontSize: 28, margin: 0, fontStyle: "italic" }}>
                Menü der Sinne 🌹
              </h1>
            </div>

            <button onClick={() => setView("cart")} style={{ background: "transparent", border: "none", cursor: "pointer", position: "relative" }}>
              <span style={{ fontSize: 30 }}>🛒</span>
              {cart.length > 0 && (
                <span style={styles.cartBadge}>{cart.length}</span>
              )}
            </button>
          </header>

          <div style={{ maxWidth: 960, margin: "0 auto", padding: "0 20px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14, margin: "14px 0 22px" }}>
              <div style={{ flex: 1, height: 1, background: "linear-gradient(to right, transparent, #e23b6644)" }} />
              <span style={{ color: "#e23b6688", fontSize: 18 }}>❧</span>
              <div style={{ flex: 1, height: 1, background: "linear-gradient(to left, transparent, #e23b6644)" }} />
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
              {COURSES.map(course => {
                const active = activeCourseId === course.id;
                const courseCartCount = cart.filter(c => c.courseId === course.id).length;
                return (
                  <button
                    key={course.id}
                    onClick={() => {
                      setActiveCourseId(course.id);
                      setActiveCategory("all");
                    }}
                    style={{
                      flex: 1, padding: "12px 6px",
                      background: active ? "linear-gradient(135deg, #e23b66, #9e1b40)" : "#ffffff0a",
                      border: active ? "1px solid #ffccd8aa" : "1px solid #ffffff15",
                      borderRadius: 40,
                      color: active ? "#ffffff" : "#f080a0aa",
                      fontSize: 13, fontWeight: active ? 700 : 500,
                      cursor: "pointer", transition: "all 0.25s ease",
                      boxShadow: active ? "0 4px 20px #e23b6655" : "none",
                      display: "flex", alignItems: "center", justifyContent: "center", gap: 6
                    }}
                  >
                    <span>{course.label}</span>
                    {courseCartCount > 0 && (
                      <span style={styles.pillBadge}>{courseCartCount}</span>
                    )}
                  </button>
                );
              })}
            </div>

            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <h2 className="serif" style={{ color: "#ffccd8", fontSize: 22, margin: "0 0 4px" }}>
                {currentCourse.label}
              </h2>
              <p style={{ color: "#f080a0", fontSize: 11, letterSpacing: 3, textTransform: "uppercase", margin: 0 }}>
                {currentCourse.subtitle}
              </p>
            </div>

            <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 12, marginBottom: 20 }}>
              {currentCourse.categories.map(cat => {
                const active = activeCategory === cat.id;
                return (
                  <button
                    key={cat.id}
                    onClick={() => setActiveCategory(cat.id)}
                    style={{
                      whiteSpace: "nowrap",
                      padding: "7px 16px",
                      borderRadius: 20,
                      fontSize: 12,
                      fontWeight: active ? 600 : 400,
                      background: active ? "#ffffff22" : "#ffffff06",
                      border: active ? "1px solid #ffccd8" : "1px solid #ffffff10",
                      color: active ? "#ffccd8" : "#f080a0aa",
                      cursor: "pointer",
                      transition: "all 0.2s ease"
                    }}
                  >
                    {cat.label}
                  </button>
                );
              })}
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(155px, 1fr))", gap: 12, paddingBottom: 110 }}>
              {filteredItems.map(item => {
                const selected = inCart(item.id);
                const isPopping = pulseId === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => toggleCart(item, activeCourseId)}
                    style={{
                      background: selected 
                        ? "linear-gradient(145deg, #3d0d24, #260515)" 
                        : "linear-gradient(145deg, #1f0714, #12030a)",
                      border: selected 
                        ? "1.5px solid #ff8da8" 
                        : item.isKinky 
                          ? "1px solid #e23b6666" 
                          : "1px solid #ffffff12",
                      borderRadius: 18,
                      padding: "16px 10px 14px",
                      cursor: "pointer",
                      textAlign: "center",
                      transition: "all 0.2s ease",
                      transform: isPopping ? "scale(0.93)" : "scale(1)",
                      boxShadow: selected ? "0 4px 22px #e23b6644" : "0 2px 10px #00000044",
                      position: "relative",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      justifyContent: "space-between",
                      minHeight: 180
                    }}
                  >
                    {selected && (
                      <div style={styles.selectedCheckMark}>
                        <svg viewBox="0 0 12 12" width="10" height="10">
                          <polyline points="2,6 5,9 10,3" stroke="#fff" strokeWidth="2" fill="none" strokeLinecap="round" />
                        </svg>
                      </div>
                    )}

                    {item.isKinky && (
                      <div style={{ fontSize: 9, background: "#e23b6633", color: "#ff8da8", border: "1px solid #e23b6666", padding: "2px 6px", borderRadius: 10, marginBottom: 4, fontWeight: 700 }}>
                        DOM / BDSM
                      </div>
                    )}

                    <div>
                      <div style={{ fontSize: 36, marginBottom: 8 }}>{item.emoji}</div>
                      <div style={{ color: selected ? "#ffffff" : "#ffe3ec", fontSize: 13, fontWeight: 600, marginBottom: 6, lineHeight: 1.2 }}>
                        {item.name}
                      </div>
                    </div>

                    <div style={{ color: "#f080a0aa", fontSize: 10, lineHeight: 1.3 }}>
                      {item.desc}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {cart.length > 0 && (
            <div style={styles.floatingBar}>
              <button onClick={() => setView("cart")} style={styles.primaryOrderBtn}>
                🛒 Auswahl ansehen ({cart.length} {cart.length === 1 ? "Gericht" : "Gerichte"})
              </button>
            </div>
          )}
        </div>
      );
    }

    const styles = {
      pageContainer: {
        minHeight: "100vh",
        background: "linear-gradient(160deg, #100408 0%, #220815 50%, #0d0206 100%)",
        color: "#fce8ef"
      },
      cartBadge: {
        position: "absolute", top: -4, right: -6,
        background: "#e23b66", color: "#fff",
        borderRadius: "50%", width: 20, height: 20,
        fontSize: 11, fontWeight: 700,
        display: "flex", alignItems: "center", justifyContent: "center",
        border: "2px solid #100408"
      },
      pillBadge: {
        background: "#ffffff33", color: "#fff",
        borderRadius: 10, padding: "1px 6px",
        fontSize: 10, fontWeight: 700
      },
      selectedCheckMark: {
        position: "absolute", top: 8, right: 8,
        background: "#e23b66", borderRadius: "50%",
        width: 18, height: 18,
        display: "flex", alignItems: "center", justifyContent: "center"
      },
      kinkyBadge: {
        fontSize: 10, background: "#e23b6633", color: "#ff8da8",
        border: "1px solid #e23b6666", padding: "1px 6px", borderRadius: 8,
        marginLeft: 6, verticalAlign: "middle"
      },
      ghostBtn: {
        background: "transparent", border: "1px solid #e23b6666",
        color: "#ffccd8", borderRadius: 50,
        padding: "10px 22px", fontSize: 12, cursor: "pointer",
        letterSpacing: 1
      },
      deleteBtn: {
        background: "transparent", border: "1px solid #ffffff22",
        color: "#ff8da8", borderRadius: "50%",
        width: 30, height: 30, fontSize: 18, cursor: "pointer",
        display: "flex", alignItems: "center", justifyContent: "center",
        flexShrink: 0
      },
      textarea: {
        width: "100%", background: "#ffffff0a",
        border: "1px solid #ffffff18", borderRadius: 14,
        padding: 12, color: "#fff", fontSize: 13, outline: "none"
      },
      primaryOrderBtn: {
        background: "linear-gradient(135deg, #e23b66, #9e1b40)",
        border: "none", color: "#fff",
        borderRadius: 50, padding: "16px 36px",
        fontSize: 14, fontWeight: 700, letterSpacing: 1,
        cursor: "pointer", boxShadow: "0 6px 28px #e23b6655",
        width: "100%", whiteSpace: "nowrap"
      },
      floatingBar: {
        position: "fixed", bottom: 20, left: "50%",
        transform: "translateX(-50%)", zIndex: 100,
        width: "calc(100% - 40px)", maxWidth: 440
      },
      doneCard: {
        background: "linear-gradient(145deg, #240916, #14030b)",
        border: "1px solid #e23b6644", borderRadius: 24,
        padding: "40px 28px", maxWidth: 520,
        width: "calc(100% - 40px)", margin: "40px auto",
        textAlign: "center", boxShadow: "0 0 80px #e23b6622"
      }
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
